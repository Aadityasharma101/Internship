{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block dash_title %}Admin{% endblock %} — NewsHub</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="{% static 'css/newshub.css' %}" rel="stylesheet">
</head>
<body class="bg-light">
    <nav class="navbar navbar-dark dash-navbar">
        <div class="container-fluid px-4">
            <a class="brand navbar-brand text-white fw-bold" href="{% url 'admin_dashboard' %}">
                <i class="bi bi-shield-lock"></i> NewsHub Admin
            </a>
            <div class="d-flex align-items-center gap-3 text-white">
                <span><i class="bi bi-person-circle"></i> {{ user.username }}</span>
                <a href="{% url 'admin_logout' %}" class="btn btn-sm btn-outline-light">Logout</a>
            </div>
        </div>
    </nav>

    {% if messages %}
    <div class="container-fluid px-4 mt-3">
        {% for message in messages %}
        <div class="alert alert-{{ message.tags|default:'info' }} alert-dismissible fade show">{{ message }}<button type="button" class="btn-close" data-bs-dismiss="alert"></button></div>
        {% endfor %}
    </div>
    {% endif %}

    <div class="container-fluid">
        <div class="row">
            <div class="col-md-2 dash-sidebar py-3" style="background: #0d1117;">
                <nav class="nav flex-column">
                    <a class="nav-link {% if request.resolver_match.url_name == 'admin_dashboard' %}active{% endif %}" href="{% url 'admin_dashboard' %}"><i class="bi bi-speedometer2 me-2"></i>Dashboard</a>
                    <a class="nav-link {% if 'article' in request.resolver_match.url_name %}active{% endif %}" href="{% url 'admin_article_list' %}"><i class="bi bi-newspaper me-2"></i>All Articles</a>
                    <a class="nav-link {% if 'employee' in request.resolver_match.url_name %}active{% endif %}" href="{% url 'admin_employee_list' %}"><i class="bi bi-people me-2"></i>Employees</a>
                    <a class="nav-link {% if request.resolver_match.url_name == 'admin_user_list' %}active{% endif %}" href="{% url 'admin_user_list' %}"><i class="bi bi-person-lines-fill me-2"></i>All Users</a>
                    <a class="nav-link" href="{% url 'home' %}"><i class="bi bi-house me-2"></i>View Site</a>
                </nav>
            </div>
            <div class="col-md-10 p-4">
                {% block dash_content %}{% endblock %}
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
