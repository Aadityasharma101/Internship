<!-- templates/frontend/components/comment_card.html -->
<div class="comment-card {% if comment.parent %}reply-card{% endif %}">
    <!-- Left Side: Avatar -->
    <div class="comment-avatar-wrapper">
        {% if comment.profile_pic %}
            <img src="{{ comment.profile_pic }}" alt="{{ comment.author_name }}'s avatar" class="comment-avatar">
        {% else %}
            <!-- Fallback: Author initials -->
            <div class="comment-avatar-placeholder">
                {{ comment.author_initials }}
            </div>
        {% endif %}
    </div>

    <!-- Right Side: Content -->
    <div class="comment-content">
        <div class="comment-header">
            <!-- Author name -->
            <span class="comment-username">{{ comment.author_name }}</span>
            
            <!-- Timestamp -->
            <span class="comment-timestamp">
                {{ comment.time_ago }}
            </span>
        </div>
        
        <!-- Comment body -->
        <div class="comment-body">
            <p>{{ comment.text }}</p>
        </div>
    </div>
</div>
