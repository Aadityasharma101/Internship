<form method="post" action="{% url 'toggle_bookmark' article.slug %}" class="d-inline">
    {% csrf_token %}
    <input type="hidden" name="next" value="{{ request.path }}">
    <button type="submit" class="btn {% if is_bookmarked %}btn-warning{% else %}btn-outline-warning{% endif %} btn-sm">
        <i class="bi bi-star{% if is_bookmarked %}-fill{% endif %}"></i>
        {% if is_bookmarked %}Saved{% else %}Bookmark{% endif %}
    </button>
</form>
