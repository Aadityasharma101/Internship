<div class="comment-card">
    <div class="comment-avatar">
        {% if comment.profile_pic %}
            <img src="{{ comment.profile_pic }}" alt="{{ comment.author_name }} avatar" loading="lazy">
        {% else %}
            <span class="comment-avatar-placeholder">{{ comment.author_initials|default:"?" }}</span>
        {% endif %}
    </div>
    <div class="comment-body">
        <div class="comment-header">
            <span class="comment-author">{{ comment.author_name }}</span>
            <time class="comment-time" datetime="{{ comment.created_at|default:'' }}" title="{{ comment.created_at|default:'' }}">
                {{ comment.time_ago }}
            </time>
        </div>
        <p class="comment-text">{{ comment.text|default:comment.body }}</p>
    </div>
</div>
